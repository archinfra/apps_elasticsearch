name: Build Offline Run
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - ci/build-request.txt
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'
      - name: Smoke test
        run: bash tests/validate.sh
      - name: Build offline installer
        run: bash build.sh --arch ${{ matrix.arch }}
      - name: Validate Fluent Bit with the native image
        run: bash tests/fluentbit-runtime.sh ${{ matrix.arch }}
      - name: Inspect embedded payload and image platforms
        run: python3 tests/verify-payload.py "dist/elasticsearch-installer-v$(cat VERSION)-${{ matrix.arch }}.run" --arch ${{ matrix.arch }}
      - name: Verify checksum
        run: |
          cd dist
          sha256sum -c *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: elasticsearch-offline-${{ matrix.arch }}
          path: dist/*
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          pattern: elasticsearch-offline-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
