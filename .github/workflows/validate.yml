name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  installer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static and mock install tests
        run: bash tests/validate.sh
      - name: Check shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning build.sh scripts/assemble-install.sh scripts/install/modules/*.sh tests/validate.sh
