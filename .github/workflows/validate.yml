name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  installer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'
      - name: Run static and mock install tests
        run: bash tests/validate.sh
      - name: Check shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          bash scripts/assemble-install.sh install.sh
          shellcheck -S warning build.sh scripts/assemble-install.sh install.sh tests/validate.sh
