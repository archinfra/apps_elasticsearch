installer: 0.1.0
elasticsearch: 9.5.5
kibana: 9.5.5
eck: 3.5.0
fluent_bit: 5.1.3
sources:
  elasticsearch: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
  kibana: docker.elastic.co/kibana/kibana:9.5.5
  operator: docker.elastic.co/eck/eck-operator:3.5.0
  fluent_bit: ghcr.io/fluent/fluent-bit:5.1.3
  eck_crds: https://download.elastic.co/downloads/eck/3.5.0/crds.yaml
