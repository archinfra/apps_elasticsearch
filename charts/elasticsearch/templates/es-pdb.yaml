{{- if gt (int .Values.elasticsearch.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "archinfra.esname" . }}-pdb
spec:
  minAvailable: {{ sub (int .Values.elasticsearch.replicas) 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: archinfra-elasticsearch
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
