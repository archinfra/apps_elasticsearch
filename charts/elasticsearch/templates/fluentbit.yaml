{{- if .Values.fluentBit.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-fluent-bit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-fluent-bit
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-fluent-bit
subjects:
  - {kind: ServiceAccount, name: "{{ .Release.Name }}-fluent-bit", namespace: "{{ .Release.Namespace }}"}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                 2
        Daemon                Off
        Log_Level             info
        storage.path          /buffers/storage
        storage.sync          normal
        storage.max_chunks_up 128
        HTTP_Server           On
        HTTP_Listen           0.0.0.0
        HTTP_Port             2020

    [INPUT]
        Name                  tail
        Path                  /var/log/containers/*.log
        Tag                   kube.*
        multiline.parser      docker, cri
        DB                    /buffers/tail.db
        storage.type          filesystem
        storage.total_limit_size {{ .Values.fluentBit.bufferSize }}
        Read_from_Head        Off
        Skip_Long_Lines       On
        Refresh_Interval      5

    [FILTER]
        Name                  kubernetes
        Match                 kube.*
        Kube_Tag_Prefix       kube.var.log.containers.
        Merge_Log             On
        Keep_Log              On
        Labels                Off
        Annotations           Off

    [OUTPUT]
        Name                  es
        Match                 kube.*
        Host                  {{ include "archinfra.eshost" . }}
        Port                  9200
        TLS                   On
        TLS.Verify            On
        TLS.Verify_Hostname   On
        TLS.CA_File           /tls/ca.crt
        HTTP_User             archinfra_log_writer
        HTTP_Passwd           ${WRITER_PASSWORD}
        Logstash_Format       On
        Logstash_Prefix       logs-k8s
        Suppress_Type_Name    On
        Generate_ID           On
        Retry_Limit           False
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-fluent-bit-metrics
  labels:
    app.kubernetes.io/name: archinfra-fluent-bit
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: archinfra-fluent-bit
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: metrics, port: 2020, targetPort: metrics}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: archinfra-fluent-bit
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: archinfra-fluent-bit
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-fluent-bit
      nodeSelector:
        kubernetes.io/arch: {{ .Values.arch }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: fluent-bit
          image: "{{ .Values.image.registry }}/{{ .Values.image.fluentBit }}:{{ .Values.image.tagFluentBit }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources: {{ toYaml .Values.fluentBit.resources | nindent 12 }}
          ports:
            - {name: metrics, containerPort: 2020}
          env:
            - name: WRITER_PASSWORD
              valueFrom:
                secretKeyRef: {name: "{{ include "archinfra.auth" . }}", key: writer-password}
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc/fluent-bit.conf, subPath: fluent-bit.conf, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: logs, mountPath: /var/log, readOnly: true}
            - {name: buffers, mountPath: /buffers}
      volumes:
        - name: config
          configMap: {name: "{{ .Release.Name }}-fluent-bit"}
        - name: tls
          secret: {secretName: "{{ include "archinfra.tls" . }}"}
        - name: logs
          hostPath: {path: /var/log, type: Directory}
        - name: buffers
          hostPath: {path: /var/lib/archinfra/fluent-bit, type: DirectoryOrCreate}
{{- end }}
