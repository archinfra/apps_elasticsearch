{{- if .Values.kibana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kibana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: archinfra-kibana
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: http, port: 5601, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kibana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: archinfra-kibana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: archinfra-kibana
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      nodeSelector:
        kubernetes.io/arch: {{ .Values.arch }}
      containers:
        - name: kibana
          image: "{{ .Values.image.registry }}/{{ .Values.image.kibana }}:{{ .Values.image.tagKibana }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources: {{ toYaml .Values.kibana.resources | nindent 12 }}
          ports:
            - {name: http, containerPort: 5601}
          env:
            - {name: SERVER_HOST, value: "0.0.0.0"}
            - {name: ELASTICSEARCH_HOSTS, value: '["https://{{ include "archinfra.eshost" . }}:9200"]'}
            - {name: ELASTICSEARCH_USERNAME, value: kibana_system}
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef: {name: "{{ include "archinfra.auth" . }}", key: kibana-password}
            - name: XPACK_SECURITY_ENCRYPTIONKEY
              valueFrom:
                secretKeyRef: {name: "{{ include "archinfra.auth" . }}", key: kibana-encryption-key}
            - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
              valueFrom:
                secretKeyRef: {name: "{{ include "archinfra.auth" . }}", key: kibana-encryption-key}
            - name: XPACK_REPORTING_ENCRYPTIONKEY
              valueFrom:
                secretKeyRef: {name: "{{ include "archinfra.auth" . }}", key: kibana-encryption-key}
            - {name: ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES, value: /usr/share/kibana/config/certs/ca.crt}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: tls, mountPath: /usr/share/kibana/config/certs, readOnly: true}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "archinfra.tls" . }}
{{- end }}
